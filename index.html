    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Poppins"', 'sans-serif'],
              serif: ['"Poppins"', 'sans-serif'], 
            },
            colors: {
              brand: {
                cream: '#FDFBF7',      // Warm Cream - Background
                dark: '#050505',       // Rich Black - Text/Primary
                accent: '#2563EB',     // Royal Blue - Actions
                secondary: '#F3F4F6',  // Light Gray - Secondary Elements
                light: '#FFFFFF'       // Pure White
              }
            },
            animation: {
              'spin-slow': 'spin 12s linear infinite',
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #FDFBF7;
      }
      ::-webkit-scrollbar-thumb {
        background: #050505;
        border-radius: 3px;
      }
    </style>
  </head>
  <body class="bg-brand-cream text-brand-dark antialiased selection:bg-brand-dark selection:text-white overflow-x-hidden font-sans">
